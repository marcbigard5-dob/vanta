[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opensource-intelligence-hub"
version = "0.1.0"
description = "Local-first discovery and evaluation of open-source tools, APIs, LLM apps and MCP servers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
osihub = "osihub.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
osihub = ["sources.json"]
